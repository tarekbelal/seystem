<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة صيانة الموبايل</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Tajawal', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #22315C; border-radius: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    input::placeholder, textarea::placeholder { color: #56638A; }
    @keyframes floatUp { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
    .fade-in { animation: floatUp .25s ease-out; }
  </style>
</head>
<body style="background: radial-gradient(1100px 500px at 15% -10%, rgba(59,110,255,0.16), transparent 60%), radial-gradient(900px 500px at 100% 0%, rgba(45,212,191,0.08), transparent 55%), #060913; color: #E7ECFF; min-height: 100vh;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const APP_USER_NAME = 'طارق بلال';
    const DEFAULT_PASSWORD = 'teto9090@&$';

    const STATUS = {
      received: { label: 'مستلم', color: '#4C8DFF', bg: 'rgba(76,141,255,0.14)' },
      in_progress: { label: 'قيد الإصلاح', color: '#F5A524', bg: 'rgba(245,165,36,0.14)' },
      ready: { label: 'جاهز للتسليم', color: '#2DD4BF', bg: 'rgba(45,212,191,0.14)' },
      delivered: { label: 'تم التسليم', color: '#22C55E', bg: 'rgba(34,197,94,0.16)' },
    };

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

    const emptyForm = {
      id: null, customerName: '', phone: '', deviceName: '', model: '',
      issue: '', price: '', deposit: '', status: 'received', notes: '',
      dateReceived: new Date().toISOString().slice(0, 10), dateDelivered: '',
    };

    function App() {
      const [booting, setBooting] = useState(true);
      const [authed, setAuthed] = useState(false);
      const [authPassword, setAuthPassword] = useState(DEFAULT_PASSWORD);
      const [pwInput, setPwInput] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [loginError, setLoginError] = useState('');

      const [shopName, setShopName] = useState('محل الصيانة');
      const [devices, setDevices] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [dataLoaded, setDataLoaded] = useState(false);

      const [tab, setTab] = useState('dashboard');
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [dateFilter, setDateFilter] = useState('all');
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState(emptyForm);
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);

      const [showExpenseForm, setShowExpenseForm] = useState(false);
      const [expenseForm, setExpenseForm] = useState({ title: '', amount: '', date: new Date().toISOString().slice(0, 10) });

      const [pwForm, setPwForm] = useState({ current: '', next: '', confirm: '' });
      const [pwMsg, setPwMsg] = useState({ type: '', text: '' });
      const [shopNameDraft, setShopNameDraft] = useState('');
      const [showBackupModal, setShowBackupModal] = useState(false);
      const [copyState, setCopyState] = useState('idle');
      const [showImportModal, setShowImportModal] = useState(false);
      const [importText, setImportText] = useState('');
      const [importMsg, setImportMsg] = useState({ type: '', text: '' });

      useEffect(() => {
        try {
          const pw = localStorage.getItem('auth-password');
          if (pw) setAuthPassword(pw);
          const s = localStorage.getItem('shop-settings');
          if (s) {
            const parsed = JSON.parse(s);
            if (parsed.shopName) setShopName(parsed.shopName);
          }
        } catch (e) {}
        setBooting(false);
      }, []);

      useEffect(() => {
        if (!authed) return;
        try {
          const d = localStorage.getItem('devices');
          setDevices(d ? JSON.parse(d) : []);
          const ex = localStorage.getItem('expenses');
          setExpenses(ex ? JSON.parse(ex) : []);
        } catch (e) {
          setDevices([]);
          setExpenses([]);
        }
        setDataLoaded(true);
      }, [authed]);

      const saveDevices = (next) => {
        setDevices(next);
        try { localStorage.setItem('devices', JSON.stringify(next)); } catch (e) {}
      };
      const saveExpenses = (next) => {
        setExpenses(next);
        try { localStorage.setItem('expenses', JSON.stringify(next)); } catch (e) {}
      };
      const saveShopName = (name) => {
        setShopName(name);
        try { localStorage.setItem('shop-settings', JSON.stringify({ shopName: name })); } catch (e) {}
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (pwInput === authPassword) {
          setLoginError('');
          setAuthed(true);
          setPwInput('');
        } else {
          setLoginError('كلمة المرور غير صحيحة');
        }
      };

      const stats = useMemo(() => {
        const active = devices.filter((d) => d.status !== 'delivered');
        const ready = devices.filter((d) => d.status === 'ready');
        const delivered = devices.filter((d) => d.status === 'delivered');
        const totalIncome = delivered.reduce((s, d) => s + (Number(d.price) || 0), 0);
        const totalExpenses = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
        const totalDeposits = devices.reduce((s, d) => s + (Number(d.deposit) || 0), 0);
        const pending = active.reduce((s, d) => s + ((Number(d.price) || 0) - (Number(d.deposit) || 0)), 0);
        return { activeCount: active.length, readyCount: ready.length, deliveredCount: delivered.length, totalIncome, totalExpenses, totalDeposits, netProfit: totalIncome - totalExpenses, pending };
      }, [devices, expenses]);

      const filteredDevices = useMemo(() => {
        const todayStr = new Date().toISOString().slice(0, 10);
        const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
        return devices
          .filter((d) => (statusFilter === 'all' ? true : d.status === statusFilter))
          .filter((d) => {
            if (dateFilter === 'today') return d.dateReceived === todayStr;
            if (dateFilter === 'week') return d.dateReceived >= weekAgo;
            return true;
          })
          .filter((d) => {
            const q = search.trim().toLowerCase();
            if (!q) return true;
            return d.customerName.toLowerCase().includes(q) || d.deviceName.toLowerCase().includes(q) || (d.model || '').toLowerCase().includes(q) || (d.phone || '').toLowerCase().includes(q);
          });
      }, [devices, statusFilter, dateFilter, search]);

      if (booting) return <div className="flex items-center justify-center min-h-screen text-sm text-gray-400">جارِ التحميل...</div>;

      if (!authed) {
        return (
          <div className="flex items-center justify-center min-h-screen p-5">
            <div className="w-full max-w-sm rounded-3xl p-7 fade-in" style={{ background: 'linear-gradient(180deg, rgba(20,27,48,0.9), rgba(11,15,28,0.9))', border: '1px solid rgba(76,141,255,0.25)', boxShadow: '0 0 60px rgba(37,86,255,0.15)' }}>
              <div className="flex flex-col items-center mb-6">
                <h1 className="text-xl font-extrabold text-white">{shopName}</h1>
                <p className="text-xs mt-1 text-gray-400">نظام إدارة صيانة الأجهزة</p>
              </div>
              <form onSubmit={handleLogin} className="flex flex-col gap-3">
                <input
                  type={showPw ? 'text' : 'password'}
                  value={pwInput}
                  onChange={(e) => { setPwInput(e.target.value); setLoginError(''); }}
                  placeholder="كلمة المرور ( الافتراضية: teto9090@&$ )"
                  className="w-full rounded-xl px-3 py-3 text-sm outline-none bg-black/20 border border-blue-900/50 text-white"
                  autoFocus
                />
                {loginError && <div className="text-xs text-red-400">{loginError}</div>}
                <button type="submit" className="mt-2 rounded-xl py-3 text-sm font-bold bg-blue-600 text-white shadow-lg shadow-blue-600/30">دخول</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col min-h-screen pb-24">
          <div className="p-5 border-b border-gray-800 flex justify-between items-center bg-black/40">
            <div>
              <div className="text-xs text-gray-400">أهلاً بيك،</div>
              <div className="text-base font-bold text-white">{APP_USER_NAME}</div>
            </div>
            <button onClick={() => setAuthed(false)} className="px-3 py-1.5 rounded-lg text-xs bg-red-500/10 text-red-400 border border-red-500/20">خروج</button>
          </div>
          <div className="p-5 flex flex-col gap-4">
            <div className="text-lg font-bold">أهلاً بك في لوحة التحكم! الأجهزة المسجلة: {devices.length}</div>
            <button onClick={() => {
              const name = prompt('اسم العميل والجهاز:');
              if(name) saveDevices([{id: uid(), customerName: name, deviceName: 'موبايل', status: 'received', dateReceived: new Date().toISOString().slice(0,10)}, ...devices]);
            }} className="py-3 bg-blue-600 rounded-xl font-bold text-white">+ إضافة جهاز سريع</button>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
